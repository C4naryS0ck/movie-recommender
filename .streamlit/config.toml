# Locked dark "late-night cinema" theme: warm ink, cream text, marquee amber.
[theme]
base = "dark"
primaryColor = "#F2A93B"
backgroundColor = "#0E0C0B"
secondaryBackgroundColor = "#1C1815"
textColor = "#F4EDE4"
borderColor = "#3A332D"
linkColor = "#F2A93B"
baseRadius = "large"
buttonRadius = "full"
font = "'Bricolage Grotesque':https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&display=swap"
headingFont = "'Instrument Serif':https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
headingFontWeights = [400, 400, 400, 500, 500, 500]

[client]
toolbarMode = "minimal"
